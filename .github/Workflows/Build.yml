name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Preparar projeto
        shell: bash
        run: |
          if [ -f projeto.zip ]; then
            mkdir -p "$RUNNER_TEMP/treinadores-build"
            unzip -qo projeto.zip -d "$RUNNER_TEMP/treinadores-build"
            echo "PROJECT_DIR=$RUNNER_TEMP/treinadores-build" >> "$GITHUB_ENV"
          elif [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "Não encontrei projeto.zip nem o código extraído na raiz."
            exit 1
          fi
      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: treinadores-notificacoes-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: APK pronto — notificações personalizadas
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
